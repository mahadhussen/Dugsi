name: CI

# Guards every push and pull request: unit tests, type check and a production
# build must all pass. This is the safety net so a regression cannot reach the
# Pages deploy (which only runs on main, after this).
on:
  push:
    branches-ignore: []
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Generate version stamp (lib/version.ts is generated, not committed)
        run: node scripts/stamp-version.mjs
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
